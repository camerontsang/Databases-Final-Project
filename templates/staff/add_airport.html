{% extends 'layout.html' %}

{% block title %}Add Airport - Air Ticket System{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card">
        <h2 class="card-header">🏛️ Add New Airport</h2>
        
        <form method="POST" action="{{ url_for('staff_add_airport') }}">
            <div class="form-group">
                <label for="airport_code">Airport Code *</label>
                <input type="text" name="airport_code" id="airport_code" class="form-control" required
                       maxlength="3" placeholder="e.g., JFK">
            </div>

            <div class="form-group">
                <label for="airport_name">Airport Name *</label>
                <input type="text" name="airport_name" id="airport_name" class="form-control" required
                       placeholder="e.g., John F. Kennedy International">
            </div>

            <div class="form-group">
                <label for="city">City *</label>
                <input type="text" name="city" id="city" class="form-control" required
                       placeholder="e.g., New York">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Add Airport</button>
        </form>
        
        <a href="{{ url_for('staff_home') }}" class="btn btn-secondary btn-block mt-2">Cancel</a>
    </div>
</div>
{% endblock %}
