{% extends 'layout.html' %}

{% block title %}Add Airplane - Air Ticket System{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card">
        <h2 class="card-header">Add New Airplane</h2>
        <p class="mb-3">Adding airplane for: <strong>{{ airline }}</strong></p>
        
        <form method="POST" action="{{ url_for('staff_add_airplane') }}">
            <div class="form-group">
                <label for="airplane_id">Airplane ID *</label>
                <input type="text" name="airplane_id" id="airplane_id" class="form-control" required
                       placeholder="e.g 67">
            </div>

            <div class="form-group">
                <label for="model">Aircraft Model *</label>
                <input type="text" name="model" id="model" class="form-control" required
                       placeholder="e.g. A380">
            </div>

            <div class="form-group">
                <label for="seats">Number of Seats *</label>
                <input type="number" name="seats" id="seats" class="form-control" required min="1"
                       placeholder="e.g., 150">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Add Airplane</button>
        </form>
        
        <a href="{{ url_for('staff_home') }}" class="btn btn-secondary btn-block mt-2">Cancel</a>
    </div>
</div>
{% endblock %}
