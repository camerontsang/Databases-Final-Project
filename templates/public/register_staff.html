{% extends 'layout.html' %}

{% block title %}Staff Registration - Air Ticket System{% endblock %}

{% block content %}
<div class="auth-container" style="max-width: 500px;">
    <div class="card">
        <h2 class="card-header">Airline Staff Registration</h2>
        
        <form method="POST" action="{{ url_for('register_staff') }}">
            <div class="form-group">
                <label for="username">Username *</label>
                <input type="text" name="username" id="username" class="form-control" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="first_name">First Name *</label>
                    <input type="text" name="first_name" id="first_name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="last_name">Last Name *</label>
                    <input type="text" name="last_name" id="last_name" class="form-control" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="date_of_birth">Date of Birth</label>
                <input type="date" name="date_of_birth" id="date_of_birth" class="form-control">
            </div>
            
            <div class="form-group">
                <label for="airline_name">Airline *</label>
                <select name="airline_name" id="airline_name" class="form-control" required>
                    <option value="">Select an airline</option>
                    {% for airline in airlines %}
                    <option value="{{ airline.airline_name }}">{{ airline.airline_name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" name="password" id="password" class="form-control" required minlength="6">
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Confirm Password *</label>
                <input type="password" name="confirm_password" id="confirm_password" class="form-control" required>
            </div>
            
            <p class="text-center" style="color: #666; font-size: 0.9rem;">
                Note: Permissions (Admin/Operator) must be granted by an existing administrator.
            </p>
            
            <button type="submit" class="btn btn-primary btn-block mt-3">Register</button>
        </form>
        
        <p class="text-center mt-3">
            Already have an account? <a href="{{ url_for('login') }}">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
