{% extends 'layout.html' %}

{% block title %}Customer Registration - Air Ticket System{% endblock %}

{% block content %}
<div class="auth-container" style="max-width: 600px;">
    <div class="card">
        <h2 class="card-header">Customer Registration</h2>
        
        <form method="POST" action="{{ url_for('register_customer') }}">
            <h4 class="mb-2">Account Information</h4>
            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" name="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" name="name" id="name" class="form-control" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" name="password" id="password" class="form-control" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm Password *</label>
                    <input type="password" name="confirm_password" id="confirm_password" class="form-control" required>
                </div>
            </div>
            
            <h4 class="mt-3 mb-2">Address</h4>
            <div class="form-row">
                <div class="form-group">
                    <label for="building_number">Building Number</label>
                    <input type="text" name="building_number" id="building_number" class="form-control">
                </div>
                <div class="form-group">
                    <label for="street">Street</label>
                    <input type="text" name="street" id="street" class="form-control">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" name="city" id="city" class="form-control">
                </div>
                <div class="form-group">
                    <label for="state">State</label>
                    <input type="text" name="state" id="state" class="form-control">
                </div>
            </div>
            
            <h4 class="mt-3 mb-2">Personal Information</h4>
            <div class="form-row">
                <div class="form-group">
                    <label for="phone_number">Phone Number</label>
                    <input type="tel" name="phone_number" id="phone_number" class="form-control">
                </div>
                <div class="form-group">
                    <label for="date_of_birth">Date of Birth</label>
                    <input type="date" name="date_of_birth" id="date_of_birth" class="form-control">
                </div>
            </div>
            
            <h4 class="mt-3 mb-2">Passport Information</h4>
            <div class="form-row">
                <div class="form-group">
                    <label for="passport_number">Passport Number</label>
                    <input type="text" name="passport_number" id="passport_number" class="form-control">
                </div>
                <div class="form-group">
                    <label for="passport_country">Passport Country</label>
                    <input type="text" name="passport_country" id="passport_country" class="form-control">
                </div>
            </div>
            
            <div class="form-group">
                <label for="passport_expiration">Passport Expiration</label>
                <input type="date" name="passport_expiration" id="passport_expiration" class="form-control">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block mt-3">Register</button>
        </form>
        
        <p class="text-center mt-3">
            Already have an account? <a href="{{ url_for('login') }}">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
